  /api/v2/count/homework:
    get:
      tags:
        - Journal
      summary: Получение счетчиков домашних и лабораторных работ
      description: |
        Возвращает счетчики по статусам домашних заданий или лабораторных работ
        для указанной группы.

        Значения параметра `type`:
        - `0` - домашние задания
        - `1` - лабораторные работы

        Значения `counter_type` в ответе:
        - `0` - просрочено
        - `1` - проверено
        - `2` - на проверке
        - `3` - текущие (не сделанные)
        - `4` - общее количество
        - `5` - удалено преподавателем
      operationId: getHomeworkCounters
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/RefererHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - name: type
          in: query
          required: true
          description: |
            Тип работ.
            `0` - домашние задания, `1` - лабораторные работы.
          schema:
            type: integer
            enum:
              - 0
              - 1
          example: 0
        - name: group_id
          in: query
          required: true
          description: Идентификатор группы
          schema:
            type: integer
          example: 2651
      responses:
        '200':
          description: Счетчики успешно получены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HomeworkCounterItem'
              example:
                - counter_type: 1
                  counter: 318
                - counter_type: 3
                  counter: 6
                - counter_type: 0
                  counter: 0
                - counter_type: 2
                  counter: 0
                - counter_type: 5
                  counter: 2
                - counter_type: 4
                  counter: 326
        '422':
          description: Указанная группа не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthValidationErrors'
              example:
                - field: group_id
                  message: Группа не найдена
        '401':
          $ref: '#/components/responses/Unauthorized'
