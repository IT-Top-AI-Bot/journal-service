  /api/v2/dashboard/chart/average-progress:
    get:
      tags:
        - Grades
      summary: Получение графика средней успеваемости
      description: |
        Возвращает данные для графика средней успеваемости пользователя по периодам.
      operationId: getAverageProgressChart
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/RefererHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
      responses:
        '200':
          description: Данные графика успешно получены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AverageProgressChartItem'
              example:
                - date: '2025-10-01'
                  points: 3
                  previous_points: null
                  has_rasp: null
                - date: '2025-11-01'
                  points: 3
                  previous_points: 3
                  has_rasp: null
