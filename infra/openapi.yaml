  /api/v2/homework/operations/create:
    post:
      tags:
        - Journal
      summary: Отправка выполненного домашнего задания
      description: |
        Создаёт ответ студента на домашнее задание.
        Запрос отправляется как `multipart/form-data` и может содержать
        бинарный файл и текстовый ответ.
      operationId: createHomeworkSubmission
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/RefererHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HomeworkSubmissionCreateRequest'
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        '201':
          description: Ответ по домашнему заданию успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeworkSubmissionCreateResponse'
              example:
                id: 3403574
                filename: null
                file_path: https://fs.top-academy.ru/api/v1/files/0cMo9uas4mJwbkHU3ldWkZkutkzDqMSe
                tmp_file: null
                mark: null
                creation_time: '2026-04-19'
                stud_answer: test description
                auto_mark: false
        '422':
          description: Некорректный идентификатор домашнего задания или невозможность сохранить ответ
          content:
            application/json:
              examples:
                invalidHomeworkId:
                  summary: Некорректный идентификатор домашнего задания
                  value:
                    - field: id
                      message: Значение «Id» неверно.
                cantSaveHomework:
                  summary: Домашнее задание слишком старое и ответ сохранить нельзя
                  value:
                    name: Unprocessable entity
                    message: Can't save homework
                    code: 3002
                    status: 422
        '401':
          $ref: '#/components/responses/Unauthorized'

