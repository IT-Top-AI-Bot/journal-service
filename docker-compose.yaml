services:
  postgres:
    image: postgres:18-alpine
    restart: "no"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ${PWD}/docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  valkey:
    image: valkey/valkey:9-alpine
    restart: "no"
    ports:
      - "6379:6379"
    healthcheck:
      test: valkey-cli ping
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    restart: "no"
    command:
      - "start-dev"
      - "--features=token-exchange"
    ports:
      - "9080:9080"
    env_file:
      - .env
    environment:
      KC_HTTP_PORT: 9080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: "${KEYCLOAK_DB_NAME}"
      KC_DB_USERNAME: "${KEYCLOAK_DB_USER}"
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/9080 && echo -e \"GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && timeout 2 cat <&3 | grep -q \"200 OK\"" ]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: