openapi: 3.0.3
info:
  title: College Journal API
  version: 0.1.0
  description: |
    Черновая OpenAPI-спецификация для Journal колледжа.

    Спецификация будет наполняться по реальным HTTP-запросам, ответам
    и описаниям бизнес-сценариев.

servers:
  - url: https://msapi.top-academy.ru
    description: Основной API Journal

tags:
  - name: Auth
    description: Аутентификация и авторизация
  - name: Journal
    description: Электронный журнал
  - name: Students
    description: Работа со студентами
  - name: Groups
    description: Работа с группами
  - name: Grades
    description: Оценки и успеваемость
  - name: Schedule
    description: Расписание занятий
  - name: Progress
    description: Прогресс обучения, посещения и экзамены

paths:
  /api/v2/auth/login:
    post:
      tags:
        - Auth
      summary: Вход в систему
      description: |
        Аутентификация пользователя Journal по логину и паролю.

        Для запроса требуется передавать стандартные заголовки клиента Journal:
        `Content-Type`, `Accept`, `Referer`, `Origin` и непустой `User-Agent`.
      operationId: login
      parameters:
        - $ref: '#/components/parameters/ContentTypeHeader'
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/RefererHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              application_key: 6a56a5df2667e65aab73ce76d1dd737f7d1faef9c52e8b8c55ac75f565d8e8a6
              id_city: null
              password: TestPassword123123
              username: Voron_zw26
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
              example:
                access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwczpcL1wvbXNhcGkuaXRzdGVwLm9yZyIsImlhdCI6MTc3NjYwMTcwMiwiYXVkIjoxLCJleHAiOjE3NzY2MjMzMDIsImFwaUFwcGxpY2F0aW9uSWQiOjEsImFwaVVzZXJUeXBlSWQiOjEsInVzZXJJZCI6NDAyNzQsImlkQ2l0eSI6MTE2fQ.NLmuIytR7oj2aVoecG8rfTXeLGxZN8PUr-wN0MoZZBM
                refresh_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwczpcL1wvbXNhcGkuaXRzdGVwLm9yZyIsImlhdCI6MTc3NjYwMTcwMiwiYXVkIjoxLCJleHAiOjE3NzY2MjMzMDIsImFwaUFwcGxpY2F0aW9uSWQiOjEsImFwaVVzZXJUeXBlSWQiOjEsInVzZXJJZCI6NDAyNzQsImlkQ2l0eSI6MTE2fQ.NLmuIytR7oj2aVoecG8rfTXeLGxZN8PUr-wN0MoZZBM
                expires_in_refresh: 1776623302
                expires_in_access: 1776623302
                user_type: 1
                city_data:
                  id_city: 116
                  prefix: sham
                  translate_key: SHAMBALA
                  timezone_name: Europe/Moscow
                  country_code: RU/RUS
                  market_status: 1
                  name: Шамбала
                user_role: student
        '422':
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthValidationErrors'
              examples:
                invalidUsername:
                  summary: Неверный логин
                  value:
                    - field: username
                      message: Неверный логин или пароль
                invalidPassword:
                  summary: Неверный пароль
                  value:
                    - field: password
                      message: Неверный логин или пароль
        '410':
          description: Указанный application key удален или недействителен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationKeyGoneResponse'
              example:
                name: Gone
                message: Application with key "15463456456754611" was deleted
                code: 0
                status: 410
  /api/v2/auth/refresh:
    post:
      tags:
        - Auth
      summary: Обновление access token по refresh token
      description: |
        Обновляет пару токенов доступа по ранее выданному `refresh_token`.

        Для запроса требуется передавать стандартные заголовки клиента Journal:
        `Content-Type`, `Accept`, `Referer`, `Origin` и непустой `User-Agent`.
      operationId: refreshToken
      parameters:
        - $ref: '#/components/parameters/ContentTypeHeader'
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/RefererHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refresh_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwczpcL1wvbXNhcGkuaXRzdGVwLm9yZyIsImlhdCI6MTc3NjM2MDcwNCwiYXVkIjoxLCJleHAiOjE3NzYzODIzMDQsImFwaUFwcGxpY2F0aW9uSWQiOjEsImFwaVVzZXJUeXBlSWQiOjEsInVzZXJJZCI6NDAyNzQsImlkQ2l0eSI6MTE2fQ.bkbth1ZNM-njzM4feNB9xy3O2oJbn2eNHu_oFxealx4
      responses:
        '200':
          description: Токены успешно обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenSuccessResponse'
              example:
                access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwczpcL1wvbXNhcGkuaXRzdGVwLm9yZyIsImlhdCI6MTc3NjYwMDM1MSwiYXVkIjoxLCJleHAiOjE3NzY2MjE5NTEsImFwaUFwcGxpY2F0aW9uSWQiOjEsImFwaVVzZXJUeXBlSWQiOjEsInVzZXJJZCI6NDAyNzQsImlkQ2l0eSI6MTE2fQ.L02OLgBdpSj-Un3CGw9Y9JI_vDYUAfxcANLqntx9dRU
                refresh_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwczpcL1wvbXNhcGkuaXRzdGVwLm9yZyIsImlhdCI6MTc3NjYwMDM1MSwiYXVkIjoxLCJleHAiOjE3NzY2MjE5NTEsImFwaUFwcGxpY2F0aW9uSWQiOjEsImFwaVVzZXJUeXBlSWQiOjEsInVzZXJJZCI6NDAyNzQsImlkQ2l0eSI6MTE2fQ.L02OLgBdpSj-Un3CGw9Y9JI_vDYUAfxcANLqntx9dRU
                expires_in_refresh: 1776624306
                expires_in_access: 1776624306
                user_type: 1
                city_data: null
                user_role: null
        '410':
          description: Refresh token не найден или истек
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenGoneResponse'
              example:
                name: Gone
                message: Your refresh token is not found or expired, please check your auth credentials and try to authenticate
                code: 0
                status: 410
  /api/v2/settings/user-info:
