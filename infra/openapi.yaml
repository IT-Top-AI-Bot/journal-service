  /api/v2/dashboard/progress/activity:
    get:
      tags:
        - Grades
      summary: Получение истории активности прогресса
      description: |
        Возвращает ленту активности пользователя, связанную с баллами,
        достижениями, посещениями, оценками и другими событиями прогресса.
      operationId: getProgressActivity
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/RefererHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
      responses:
        '200':
          description: История активности успешно получена
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgressActivityItem'
              example:
