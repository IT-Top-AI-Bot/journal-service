      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/ContentTypeHeader'
        - $ref: '#/components/parameters/AcceptHeader'
        - $ref: '#/components/parameters/RefererHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeworkSubmissionDeleteRequest'
            example:
              id: 3403599
      responses:
        '204':
          description: Ответ на домашнее задание успешно удалён
        '422':
          description: Ответ на домашнее задание не удалось удалить
          content:
            application/json:
              schema:
                nullable: true
                example: null
              example: null
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  parameters:
    ContentTypeHeader:
      name: Content-Type
      in: header
      required: true
      description: Тип содержимого запроса
      schema:
        type: string
        enum:
          - application/json

    AcceptHeader:
      name: Accept
      in: header
      required: true
      description: Ожидаемый тип ответа
      schema:
        type: string
        enum:
          - application/json

    RefererHeader:
      name: Referer
      in: header
      required: true
      description: Referer клиентского приложения
      schema:
        type: string
        example: https://journal.top-academy.ru/

    OriginHeader:
      name: Origin
      in: header
      required: true
      description: Origin клиентского приложения
      schema:
        type: string
        example: https://journal.top-academy.ru

    UserAgentHeader:
      name: User-Agent
      in: header
      required: true
      description: User-Agent должен быть непустым
      schema:
        type: string
        minLength: 1
        example: Mozilla/5.0

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      description: Унифицированная ошибка API
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-04-19T14:25:00Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
        path:
          type: string
          example: /journal/entries
      required:
        - status
        - error
        - message

    PaginationMeta:
      type: object
      description: Метаданные пагинации
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 125
        totalPages:
          type: integer
          example: 7
      required:
        - page
        - size
        - totalElements
        - totalPages

    LoginRequest:
      type: object
      properties:
        application_key:
          type: string
          description: Ключ клиентского приложения
          example: 6a56a5df2667e65aab73ce76d1dd737f7d1faef9c52e8b8c55ac75f565d8e8a6
        id_city:
          type: integer
          nullable: true
          description: Идентификатор города. Может быть `null`
          example: null
        password:
          type: string
          format: password
          example: TestPassword123123
        username:
          type: string
          example: Voron_zw26
      required:
        - application_key
        - id_city
        - password
        - username

    RefreshTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: JWT refresh token
      required:
        - refresh_token

    LoginSuccessResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: JWT refresh token
        expires_in_refresh:
          type: integer
          description: Время истечения refresh token в формате Unix timestamp
          example: 1776623302
        expires_in_access:
          type: integer
          description: Время истечения access token в формате Unix timestamp
          example: 1776623302
        user_type:
          type: integer
          example: 1
        city_data:
          $ref: '#/components/schemas/CityData'
        user_role:
          type: string
          example: student
      required:
        - access_token
        - refresh_token
        - expires_in_refresh
        - expires_in_access
        - user_type
        - city_data
        - user_role

    RefreshTokenSuccessResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: JWT refresh token
        expires_in_refresh:
          type: integer
          description: Время истечения refresh token в формате Unix timestamp
          example: 1776624306
        expires_in_access:
          type: integer
          description: Время истечения access token в формате Unix timestamp
          example: 1776624306
        user_type:
          type: integer
          example: 1
        city_data:
          allOf:
            - $ref: '#/components/schemas/CityData'
          nullable: true
          description: Город пользователя. В этом ответе может быть `null`
        user_role:
          type: string
          nullable: true
          description: Роль пользователя. В этом ответе может быть `null`
          example: null
      required:
        - access_token
        - refresh_token
        - expires_in_refresh
        - expires_in_access
        - user_type
        - city_data
        - user_role

