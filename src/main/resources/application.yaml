spring:
  application:
    name: it-top-ai

  threads:
    virtual:
      enabled: true

  config:
    import: optional:file:.env[.properties]

  cloud:
    aws:
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
      region:
        static: ${S3_REGION}
      s3:
        enabled: true
        endpoint: ${S3_ENDPOINT:}
        path-style-access-enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 60000

journal:
  api:
    base-url: "https://msapi.top-academy.ru/api/v2"
    application-key: 6a56a5df2667e65aab73ce76d1dd737f7d1faef9c52e8b8c55ac75f565d8e8a6
    user-agent: "itt-journal-service/1.0"
    journal-url: "https://journal.top-academy.ru"
    timeout:
      connect: 10000
      read: 15000

  token:
    refresh-interval: 14400000
    refresh-before-expiry: 300
    max-retry-attempts: 3

s3:
  bucket-name: homeworks

crypto:
  secret-key: ${ENCRYPTION_KEY:MySecretKey12345MySecretKey12345}

logging:
  level:
    com.aquadev.ittopai: DEBUG
    org.springframework.web: INFO
    org.springframework.web.client: DEBUG

server:
  port: ${SERVER_PORT:8080}
