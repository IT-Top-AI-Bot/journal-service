spring:
  application:
    name: it-top-ai

  threads:
    virtual:
      enabled: true

  task:
    scheduling:
      pool:
        size: 2

  config:
    import: optional:file:.env[.properties]

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 60000

journal:
  api:
    base-url: "https://msapi.top-academy.ru/api/v2"
    application-key: 6a56a5df2667e65aab73ce76d1dd737f7d1faef9c52e8b8c55ac75f565d8e8a6
    user-agent: "itt-journal-service/1.0"
    journal-url: "https://journal.top-academy.ru"
    timeout:
      connect: 10000
      read: 15000

  token:
    refresh-interval: 14400000
    refresh-before-expiry: 300
    max-retry-attempts: 3

kafka:
  homework-execution-topic: homework-execution
  homework-execution-result: homework-execution-result

outbox:
  batch-size: 100
  max-attempts: 5
  retry-delay-seconds: 60
  relay-interval-ms: 5000

s3:
  bucket-name: homeworks

crypto:
  secret-key: ${ENCRYPTION_KEY:MySecretKey12345MySecretKey12345}

logging:
  level:
    com.aquadev.ittopai: DEBUG
    org.springframework.web: INFO
    org.springframework.web.client: DEBUG

server:
  port: ${SERVER_PORT:8080}
