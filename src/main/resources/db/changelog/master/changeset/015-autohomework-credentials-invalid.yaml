databaseChangeLog:
  - changeSet:
      id: 015-autohomework-credentials-invalid
      author: aqua
      comment: "Add credentials_invalid flag to journal_user to track invalid journal credentials"
      changes:
        - addColumn:
            tableName: journal_user
            columns:
              - column:
                  name: credentials_invalid
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
