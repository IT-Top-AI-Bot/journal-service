databaseChangeLog:
  - changeSet:
      id: 009-user-auto-homework-subjects
      author: aqua
      changes:
        - createTable:
            tableName: user_auto_homework_subject_ids
            columns:
              - column:
                  name: settings_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_uahs_subjects_settings
                    references: user_auto_homework_settings(id)
              - column:
                  name: spec_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: user_auto_homework_subject_ids
            columnNames: settings_id, spec_id
            constraintName: pk_user_auto_homework_subject_ids
